name: cricket-reminders
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cricket
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python notifier.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CRICAPI_KEY: ${{ secrets.CRICAPI_KEY }}
      - name: Save state
        run: |
          git config user.name "cricket-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json fixtures_api.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
